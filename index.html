<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><title>GENBA FLEET PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f1e8;--card:#fffdf8;--ink:#171717;--muted:#777166;--line:#ded8ca;--ok:#28754a;--warn:#b56d00;--danger:#b33b32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:10;background:#f4f1eeee;backdrop-filter:blur(15px);padding:15px;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:.08em}.topline{display:flex;justify-content:space-between;align-items:center}.sync{font-size:11px;color:var(--muted)}
main{padding:15px}.hidden{display:none}.section{font-weight:900;margin:18px 0 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 8px #00000008}.stat b{font-size:27px;display:block}.muted{font-size:12px;color:var(--muted)}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ece8dd;font-size:11px;font-weight:800}.ok{background:#e1f0e6;color:var(--ok)}.warn{background:#fff0d3;color:var(--warn)}.danger{background:#f8dedb;color:var(--danger)}
button{border:0;background:#111;color:#fff;border-radius:13px;padding:11px 13px;font-weight:800}button.secondary{background:#fff;color:#111;border:1px solid var(--line)}button.dangerBtn{background:#a33a32}.search,select,input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;font:inherit}.asset{margin:10px 0}.asset h3{margin:0 0 4px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fffdf9f5;border-top:1px solid var(--line);display:flex;justify-content:center}.tabs button{flex:1;max-width:145px;background:transparent;color:#555;border-radius:0;font-size:11px;padding:10px 4px}.tabs button.active{color:#111;font-weight:950}
.map{height:310px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,#e8e2d6,#d8d1c3);position:relative;overflow:hidden}.road{position:absolute;width:150%;height:24px;background:#bbb4a6;top:45%;left:-20%;transform:rotate(-25deg)}.road.r2{top:67%;transform:rotate(25deg)}.pin{position:absolute;background:#111;color:#fff;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:17px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.actions{display:flex;gap:8px}.actions>*{flex:1}.toast{display:none;position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 17px;border-radius:999px;z-index:100;font-size:13px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.loginbox{width:100%;max-width:440px;background:var(--card);padding:22px;border-radius:24px;border:1px solid var(--line)}.loginbox h1{letter-spacing:.08em}.notice{padding:11px;border-radius:13px;background:#eee9dd;font-size:12px;margin:10px 0}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>GENBA FLEET</h1><p class="muted">現場・重機・ダンプ・クレーン管理</p>
<div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
<div class="actions"><button onclick="login()">ログイン</button><button class="secondary" onclick="signup()">新規登録</button></div>
<div class="notice">初回は管理者登録が必要です。Supabase設定後、最初の利用者を管理者にできます。</div>
<button class="secondary" style="width:100%" onclick="openSettings()">☁️ クラウド設定</button></div></div>

<div id="app" class="app hidden"><header><div class="topline"><div class="brand">GENBA FLEET PRO</div><div><div id="who" class="muted"></div><div id="sync" class="sync">未同期</div></div></div></header>
<main>
<section id="home"><div class="section">会社全体</div><div class="grid"><div class="stat"><span class="muted">車両・重機</span><b id="all">0</b></div><div class="stat"><span class="muted">現場稼働</span><b id="work">0</b></div><div class="stat"><span class="muted">移動中</span><b id="moving">0</b></div><div class="stat"><span class="muted">要確認</span><b id="alertsN">0</b></div></div>
<div class="section">要確認</div><div id="alerts"></div><div class="section">最近の更新</div><div id="recent"></div></section>
<section id="mapPage" class="hidden"><div class="between"><div class="section">現場MAP</div><button onclick="siteModal()">＋現場</button></div><div class="map" id="map"></div><div class="section">現場一覧</div><div id="siteList"></div></section>
<section id="fleet" class="hidden"><div class="between"><div class="section">車両・重機</div><button onclick="assetModal()">＋登録</button></div><input class="search" id="q" placeholder="名称・番号・現場・種類で検索"><div id="assetList"></div></section>
<section id="moves" class="hidden"><div class="between"><div class="section">移動・配車</div><button onclick="moveModal()">＋移動</button></div><div id="movesList"></div></section>
<section id="inspection" class="hidden"><div class="section">車検・点検アラート</div><div id="inspectionList"></div></section>
<section id="admin" class="hidden"><div class="between"><div class="section">管理者</div><button onclick="openSettings()">設定</button></div><div id="users"></div></section>
</main><nav class="tabs"><button id="t-home" onclick="nav('home')">ホーム</button><button id="t-mapPage" onclick="nav('mapPage')">現場MAP</button><button id="t-fleet" onclick="nav('fleet')">車両・重機</button><button id="t-moves" onclick="nav('moves')">移動・配車</button><button id="t-inspection" onclick="nav('inspection')">点検</button><button id="t-admin" onclick="nav('admin')">管理</button></nav></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
let sb=null,user=null,profile=null,assets=[],sites=[],moves=[],logs=[],poll=null,channel=null;
const cfg=()=>JSON.parse(localStorage.getItem('gf-supabase')||'{}');
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openSettings(){let c=cfg();document.getElementById('sheet').innerHTML=`<div class="between"><h2>クラウド設定</h2><button class="secondary" onclick="closeModal()">閉じる</button></div><div class="notice">ここにはSupabaseのProject URLとPublishable/Anon Keyを入力します。service_role keyは絶対に入力しないでください。</div><div class="field"><label>Project URL</label><input id="su" value="${c.url||''}" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable / Anon Key</label><textarea id="sk" rows="3">${c.key||''}</textarea></div><button onclick="saveSettings()">保存して接続</button>`;document.getElementById('modal').classList.add('open')}
async function saveSettings(){localStorage.setItem('gf-supabase',JSON.stringify({url:document.getElementById('su').value.trim(),key:document.getElementById('sk').value.trim()}));closeModal();await initSupabase();toast('クラウド設定を保存しました')}
async function initSupabase(){let c=cfg();if(!c.url||!c.key){return false}try{sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;await afterLogin()}return true}catch(e){toast('クラウド接続設定を確認してください');return false}}
async function login(){if(!sb){await initSupabase()}if(!sb){openSettings();return}let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return toast(r.error.message);user=r.data.user;await afterLogin()}
async function signup(){if(!sb){await initSupabase()}if(!sb){openSettings();return}let mail=email.value.trim(),pass=password.value;if(!mail||!pass)return toast('メールアドレスとパスワードを入力してください');if(pass.length<6)return toast('パスワードは6文字以上で入力してください');let r=await sb.auth.signUp({email:mail,password:pass});if(r.error)return toast(r.error.message);if(r.data.session){user=r.data.user;toast('登録してログインしました');await afterLogin();return}password.value='';toast('確認メールを送信しました。メール認証後、同じメールアドレスとパスワードでログインしてください')}}
async function afterLogin(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await ensureProfile();await load();subscribe();nav('home')}
async function ensureProfile(){let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.data)profile=r.data;else{let x=await sb.from('profiles').insert({id:user.id,email:user.email,display_name:user.email?.split('@')[0]||'ユーザー',role:'viewer'}).select().single();profile=x.data}document.getElementById('who').textContent=(profile?.display_name||user.email)+' / '+(profile?.role||'viewer')}
async function load(){let [a,s,m,l]=await Promise.all([sb.from('fleet_assets').select('*').order('updated_at',{ascending:false}),sb.from('construction_sites').select('*').order('name'),sb.from('move_records').select('*').order('created_at',{ascending:false}),sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(20)]);if(a.error||s.error||m.error)toast('データ取得エラー');assets=a.data||[];sites=s.data||[];moves=m.data||[];logs=l.data||[];document.getElementById('sync').textContent='同期 '+new Date().toLocaleTimeString('ja-JP');render()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('genba-fleet').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe();if(poll)clearInterval(poll);poll=setInterval(load,15000)}
function siteName(id){return sites.find(s=>s.id===id)?.name||'未設定'}function dleft(x){return Math.ceil((new Date(x)-new Date())/86400000)}
function nav(id){['home','mapPage','fleet','moves','inspection','admin'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('t-'+id).classList.add('active');render()}
function render(){let alerts=assets.filter(a=>dleft(a.inspection_date)<=14||dleft(a.shaken_date)<=30);all.textContent=assets.length;work.textContent=assets.filter(a=>a.status==='現場稼働').length;moving.textContent=assets.filter(a=>a.status==='移動中').length;alertsN.textContent=alerts.length;
document.getElementById('alerts').innerHTML=alerts.map(a=>`<div class="card asset"><div class="between"><b>${a.name} ${a.asset_no}</b><span class="pill danger">要確認</span></div><div class="muted">点検 ${a.inspection_date||'—'} / 車検 ${a.shaken_date||'—'}</div></div>`).join('')||'<div class="card muted">現在ありません。</div>';
document.getElementById('recent').innerHTML=logs.slice(0,5).map(l=>`<div class="card asset"><b>${l.action}</b><div class="muted">${l.detail||''} / ${new Date(l.created_at).toLocaleString('ja-JP')}</div></div>`).join('')||'<div class="card muted">更新履歴なし</div>';
map.innerHTML=sites.map((s,i)=>`<div class="pin" style="left:${10+(i*29)%80}%;top:${20+(i%3)*25}%">${s.name}<br>${assets.filter(a=>a.site_id===s.id).length}台</div>`).join('')+'<div class="road"></div><div class="road r2"></div>';
siteList.innerHTML=sites.map(s=>`<div class="card asset"><div class="between"><b>${s.name}</b><span class="pill">${assets.filter(a=>a.site_id===s.id).length}台</span></div><div class="muted">${s.address||''}</div></div>`).join('');
let q=(document.getElementById('q')?.value||'').toLowerCase();assetList.innerHTML=assets.filter(a=>(a.name+a.asset_no+a.type+siteName(a.site_id)).toLowerCase().includes(q)).map(a=>`<div class="card asset" onclick="assetModal('${a.id}')"><div class="between"><div><h3>${a.name}</h3><div class="muted">${a.asset_no} / ${a.type}</div></div><span class="pill ${a.status==='現場稼働'?'ok':a.status==='移動中'?'warn':''}">${a.status}</span></div><div class="row" style="margin-top:9px"><span class="pill">📍 ${siteName(a.site_id)}</span><span class="pill">⏱ ${a.hour_meter||0}h</span><span class="pill">🚚 ${a.odometer||0}km</span></div></div>`).join('');
movesList.innerHTML=moves.map(m=>`<div class="card asset"><div class="between"><b>${m.asset_name||'車両'}</b><span class="pill ${m.completed?'ok':'warn'}">${m.completed?'完了':'移動中'}</span></div><div class="muted">${m.from_site_name||''} → ${m.to_site_name||''}<br>${new Date(m.created_at).toLocaleString('ja-JP')}</div>${!m.completed&&m.id?`<button style="margin-top:8px" onclick="finishMove('${m.id}')">到着・完了</button>`:''}</div>`).join('')||'<div class="card muted">移動履歴なし</div>';
inspectionList.innerHTML=assets.slice().sort((a,b)=>dleft(a.inspection_date)-dleft(b.inspection_date)).map(a=>`<div class="card asset"><div class="between"><b>${a.name} ${a.asset_no}</b><span class="pill ${dleft(a.inspection_date)<=0?'danger':dleft(a.inspection_date)<=14?'warn':'ok'}">${dleft(a.inspection_date)<=0?'期限超過':dleft(a.inspection_date)+'日後'}</span></div><div class="muted">点検 ${a.inspection_date||'—'} / 車検 ${a.shaken_date||'—'} / ${siteName(a.site_id)}</div></div>`).join('');
if(profile?.role==='admin')users.innerHTML='<div class="card"><b>管理者モード</b><div class="muted">利用者管理・現場・車両削除などの権限があります。利用者の役割変更はSupabaseのprofilesから行えます。</div></div>';else users.innerHTML='<div class="card muted">管理者権限が必要です。</div>'}
async function assetModal(id){let a=id?assets.find(x=>x.id===id):null;document.getElementById('sheet').innerHTML=`<div class="between"><h2>${a?'車両・重機詳細':'車両・重機登録'}</h2><button class="secondary" onclick="closeModal()">閉じる</button></div>
<div class="field"><label>名称</label><input id="an" value="${a?.name||''}"></div><div class="field"><label>車番・機械番号</label><input id="ano" value="${a?.asset_no||''}"></div>
<div class="field"><label>種類</label><select id="at">${['バックホウ','ダンプ','クレーン','ブルドーザー','タイヤショベル','その他'].map(x=>`<option ${a?.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>現場</label><select id="as">${sites.map(s=>`<option value="${s.id}" ${a?.site_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
<div class="field"><label>状態</label><select id="ast">${['現場稼働','移動中','整備中','待機'].map(x=>`<option ${a?.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>走行距離 km</label><input id="ao" type="number" value="${a?.odometer||0}"></div><div class="field"><label>アワメーター h</label><input id="ah" type="number" step=".1" value="${a?.hour_meter||0}"></div>
<div class="field"><label>次回点検</label><input id="ai" type="date" value="${a?.inspection_date||''}"></div><div class="field"><label>車検</label><input id="ax" type="date" value="${a?.shaken_date||''}"></div><div class="field"><label>メモ</label><textarea id="am">${a?.memo||''}</textarea></div>
<div class="actions"><button onclick="saveAsset('${id||''}')">保存</button>${a?`<button class="dangerBtn" onclick="removeAsset('${a.id}')">削除</button>`:''}</div>`;document.getElementById('modal').classList.add('open')}
async function saveAsset(id){let body={name:an.value,asset_no:ano.value,type:at.value,site_id:as.value,status:ast.value,odometer:+ao.value,hour_meter:+ah.value,inspection_date:ai.value||null,shaken_date:ax.value||null,memo:am.value,updated_by:user.id};let r=id?await sb.from('fleet_assets').update(body).eq('id',id):await sb.from('fleet_assets').insert(body);if(r.error)return toast(r.error.message);closeModal();await load();toast('保存しました')}
async function removeAsset(id){if(!confirm('削除しますか？'))return;let r=await sb.from('fleet_assets').delete().eq('id',id);if(r.error)return toast(r.error.message);closeModal();await load();toast('削除しました')}
function moveModal(){document.getElementById('sheet').innerHTML=`<div class="between"><h2>現場間移動</h2><button class="secondary" onclick="closeModal()">閉じる</button></div><div class="field"><label>車両・重機</label><select id="ma">${assets.map(a=>`<option value="${a.id}">${a.name} ${a.asset_no}（${siteName(a.site_id)}）</option>`).join('')}</select></div><div class="field"><label>移動先</label><select id="mt">${sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>メモ</label><textarea id="mm"></textarea></div><button onclick="saveMove()">移動開始</button>`;document.getElementById('modal').classList.add('open')}
async function saveMove(){let a=assets.find(x=>x.id===ma.value),to=sites.find(x=>x.id===mt.value),from=siteName(a.site_id);let r=await sb.from('move_records').insert({asset_id:a.id,asset_name:a.name+' '+a.asset_no,from_site_name:from,to_site_name:to.name,memo:mm.value,user_id:user.id});if(r.error)return toast(r.error.message);let u=await sb.from('fleet_assets').update({site_id:to.id,status:'移動中',updated_by:user.id}).eq('id',a.id);if(u.error)return toast(u.error.message);closeModal();await load();toast('移動を登録しました')}
async function finishMove(id){let m=moves.find(x=>x.id===id);await sb.from('move_records').update({completed:true,completed_at:new Date().toISOString()}).eq('id',id);let a=assets.find(x=>x.id===m.asset_id);if(a)await sb.from('fleet_assets').update({status:'現場稼働',updated_by:user.id}).eq('id',a.id);await load();toast('到着処理しました')}
function siteModal(){document.getElementById('sheet').innerHTML=`<div class="between"><h2>現場登録</h2><button class="secondary" onclick="closeModal()">閉じる</button></div><div class="field"><label>現場名</label><input id="sn"></div><div class="field"><label>住所</label><input id="sa"></div><button onclick="saveSite()">保存</button>`;document.getElementById('modal').classList.add('open')}
async function saveSite(){let r=await sb.from('construction_sites').insert({name:sn.value,address:sa.value,created_by:user.id});if(r.error)return toast(r.error.message);closeModal();await load();toast('現場を登録しました')}
document.getElementById('q').addEventListener('input',render);
(async()=>{let ok=await initSupabase();if(ok&&user){} })();
</script></body></html>
